[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devdoctor-cli"
version = "0.3.0"
description = "A local development environment doctor and README setup verifier."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "DevDoctor Contributors"}]
keywords = ["developer-tools", "devops", "readme", "cli", "healthcheck"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xxx333xxx/devdoctor"
Repository = "https://github.com/xxx333xxx/devdoctor"
Issues = "https://github.com/xxx333xxx/devdoctor/issues"
Changelog = "https://github.com/xxx333xxx/devdoctor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
devdoctor = "devdoctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
